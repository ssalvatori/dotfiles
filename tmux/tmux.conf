set -sg terminal-overrides ",*:RGB"  # true color support
# curly/colored undercurls (ghostty supports these, needed for LSP squiggles)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p2%{256}%/%{255}%&%d::%p3%{255}%&%d%;m'

set -g history-limit 50000

### LOOK & FEEL ###

set-option -g focus-events on

set -g default-shell /bin/zsh
set -g default-command "reattach-to-user-namespace -l zsh"
# tmux-256color has italics/undercurl support screen-256color lacks
set -g default-terminal "tmux-256color"

set -g detach-on-destroy off

# no command delay (ghostty is local, safe to zero this out)
set -sg escape-time 0

#count windows and panes from 1
set -g base-index 1
setw -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

### KEYS ###
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded!"

bind C-h display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "lazygit"
bind C-n display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'

# Enable mouse support
set -g mouse on

# let escape sequences (images, hyperlinks) pass through to ghostty
set -g allow-passthrough on

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'

# Display tmux session name in terminal title (instead of just "tmux")
set-option -g set-titles on

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# forget the find window.  That is for chumps
bind g run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind e run-shell "~/.local/bin/tmux-sessionizer ~/.dotfiles/"
bind b run-shell "~/.local/bin/tmux-sessionizer ~"

set -g status-right '#{prefix_highlight} | %a %Y-%m-%d %H:%M'
set -g status-left-length 100

set -g @rose_pine_variant 'main'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'rose-pine/tmux'
# set -g @rose_pine_host 'off'

run '~/.tmux/plugins/tpm/tpm'

