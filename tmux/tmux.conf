#https://gist.github.com/endersonmaia/3902b94585ef46a9956c0ca9e901cb
# set-option -sa terminal-overrides ",xterm*:Tc"
set -sg terminal-overrides ",*:RGB"  # true color support

# set -g history-limit 100000

### LOOK & FEEL ###

set-option -g focus-events on

set -g default-shell /bin/zsh
set -g default-command "reattach-to-user-namespace -l zsh"
# set -g default-terminal "tmux-256color"
set -g default-terminal "screen-256color"

set -g detach-on-destroy off

# no command delay
# set -sg escape-time 0

#count windows and panes from 1
set -g base-index 1
setw -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

### KEYS ###
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded!"

bind C-h display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "lazygit"
bind C-n display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
# bind C-t display-popup -d "#{pane_current_path}" -w 75% -h 75% -E "zsh"

# Enable mouse support
set -g mouse on

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'

# Display tmux session name in terminal title (instead of just "tmux")
set-option -g set-titles on

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# tmux-fzf-url
set -g @fzf-url-history-limit '2000'
set -g @fzf-url-bind 'u'
set -g @fzf-url-open "firefox"

# forget the find window.  That is for chumps
bind g run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind e run-shell "~/.local/bin/tmux-sessionizer ~/.dotfiles/" 
bind b run-shell "~/.local/bin/tmux-sessionizer ~" 

set -g status-right '#{prefix_highlight} | %a %Y-%m-%d %H:%M'
set -g status-left-length 100


# Refresh rate in seconds (default: 2.0)
set -g @tmux_resource_monitor_refresh_rate "2.0"

# Popup width (default: 80%)
set -g @tmux_resource_monitor_width "80%"

# Popup height (default: 80%)
set -g @tmux_resource_monitor_height "40%"

# Monitor key binding (default: t)
set -g @tmux_resource_monitor_key "t"

# Overview key binding (default: T)
set -g @tmux_resource_monitor_overview_key "T"

set -g @tmux_resource_monitor_python "~/.tmux/venv/bin/python3"

set -g @rose_pine_variant 'main'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'YlanAllouche/tmux-task-monitor'
set -g @plugin 'rose-pine/tmux'


set -g @rose_pine_host 'off'

run '~/.tmux/plugins/tpm/tpm'

